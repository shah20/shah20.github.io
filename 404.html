<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)">
  <title>404 — Page Not Found | Rushabh Shah</title>
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232346c8'/%3E%3Ctext x='50%25' y='54%25' text-anchor='middle' dominant-baseline='middle' font-family='Arial,sans-serif' font-weight='700' font-size='26' fill='white'%3ERS%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f5f1;
      --surface: #ffffff;
      --text: #121722;
      --muted: #545d6e;
      --faint: #858c99;
      --line: #e3e0d8;
      --accent: #2346c8;
      --accent-ink: #ffffff;
      --accent-soft: #e9eefc;
      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e1116;
        --surface: #151a22;
        --text: #e9edf3;
        --muted: #a3acba;
        --faint: #78839a;
        --line: #262d39;
        --accent: #86a2ff;
        --accent-ink: #0b1020;
        --accent-soft: #1b2442;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.65 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

    header {
      width: min(1120px, calc(100% - 48px));
      margin: 0 auto;
      height: 64px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--line);
    }

    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; }

    .mark {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: var(--accent);
      color: var(--accent-ink);
      font-size: .78rem;
      font-weight: 800;
    }

    main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 56px 24px;
      text-align: center;
    }

    .content { max-width: 560px; }

    .code {
      font-size: clamp(6rem, 18vw, 9.5rem);
      font-weight: 800;
      letter-spacing: -.07em;
      line-height: 1;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .label {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 26px;
      font: 500 .75rem/1 var(--mono);
      text-transform: uppercase;
      letter-spacing: .12em;
      color: var(--accent);
    }

    .label::before, .label::after { content: ""; width: 22px; height: 1px; background: currentColor; }

    h1 {
      margin: 18px 0 14px;
      font-size: clamp(1.9rem, 4vw, 2.5rem);
      line-height: 1.15;
      letter-spacing: -.035em;
    }

    p { margin: 0 auto; max-width: 460px; color: var(--muted); }

    .actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 32px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 18px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--surface);
      font-size: .9rem;
      font-weight: 600;
      transition: transform .15s ease, border-color .15s ease;
    }

    .btn:hover { transform: translateY(-1px); border-color: var(--faint); }

    .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

    footer {
      width: min(1120px, calc(100% - 48px));
      margin: 0 auto;
      padding: 24px 0 36px;
      border-top: 1px solid var(--line);
      color: var(--faint);
      font-size: .86rem;
    }

    @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/"><span class="mark">RS</span>Rushabh Shah</a>
  </header>
  <main>
    <div class="content">
      <div class="code" aria-hidden="true">404</div>
      <span class="label">Page not found</span>
      <h1>This route doesn't resolve.</h1>
      <p>The page you're looking for may have moved, been renamed, or no longer exists. Let's get you back on track.</p>
      <div class="actions">
        <a class="btn primary" href="/">← Back to homepage</a>
        <a class="btn" href="mailto:shah20@ymail.com?subject=Broken%20link%20on%20your%20site">Report a broken link</a>
      </div>
    </div>
  </main>
  <footer>© 2026 Rushabh Shah · Senior Software Engineer</footer>
</body>
</html>
